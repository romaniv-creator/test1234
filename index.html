
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Планувальник бюджету</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>💰 Планувальник бюджету</h1>

        <p class="description">
            Порахуй свої гроші та сплануй заощадження!
        </p>

        <form id="budgetForm">
            <label for="income">Місячний дохід (грн):</label>
            <input type="number" id="income" min="0" step="0.01" required>

            <label for="expenses">Місячні витрати (грн):</label>
            <input type="number" id="expenses" min="0" step="0.01" required>

            <label for="unexpected">Непередбачені витрати (грн):</label>
            <input type="number" id="unexpected" min="0" step="0.01" value="0" required>

            <label for="savings">Бажані заощадження (грн):</label>
            <input type="number" id="savings" min="0" step="0.01" required>

            <button type="submit">Розрахувати бюджет</button>
            <button type="reset" class="clear-button">Очистити форму</button>
        </form>

        <div id="result">
            Тут з'явиться результат розрахунку.
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
